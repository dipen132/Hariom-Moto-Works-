<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <rect width="128" height="128" fill="#0B0B0A" />
  <!-- Left Cylinder Head & Cooling Fins (tilted -24deg around center) -->
  <g transform="translate(64 68) rotate(-24)">
    <rect x="-26" y="-44" width="24" height="10" rx="2" fill="#F3F1EC" />
    <rect x="-28" y="-31" width="28" height="4" fill="#F3F1EC" />
    <rect x="-28" y="-24" width="28" height="4" fill="#F3F1EC" />
    <rect x="-28" y="-17" width="28" height="4" fill="#F3F1EC" />
    <rect x="-26" y="-10" width="24" height="4" fill="#F3F1EC" />
    <rect x="-24" y="-3" width="20" height="10" fill="#F3F1EC" />
  </g>
  <!-- Right Cylinder Head & Cutaway Piston + Conrod (tilted +24deg) -->
  <g transform="translate(64 68) rotate(24)">
    <!-- Cylinder Cap -->
    <rect x="2" y="-44" width="24" height="10" rx="2" fill="#F3F1EC" />
    <!-- Outer Fin Tips -->
    <rect x="24" y="-31" width="6" height="4" fill="#F3F1EC" />
    <rect x="24" y="-24" width="6" height="4" fill="#F3F1EC" />
    <rect x="24" y="-17" width="6" height="4" fill="#F3F1EC" />
    <rect x="24" y="-10" width="6" height="4" fill="#F3F1EC" />
    <rect x="22" y="-3" width="6" height="10" fill="#F3F1EC" />
    <!-- Cutaway Piston (Copper-Orange #D94E2A) -->
    <rect x="4" y="-31" width="18" height="19" rx="1.5" fill="#D94E2A" />
    <rect x="4" y="-27" width="18" height="2" fill="#0B0B0A" />
    <rect x="4" y="-22" width="18" height="2" fill="#0B0B0A" />
    <circle cx="13" cy="-16" r="2.6" fill="#0B0B0A" />
    <!-- Connecting Rod -->
    <rect x="9.5" y="-12" width="7" height="26" fill="#F3F1EC" />
    <!-- Crank Big-End -->
    <circle cx="13" cy="18" r="10" fill="#F3F1EC" />
    <circle cx="13" cy="18" r="4.5" fill="#0B0B0A" />
  </g>
</svg>
